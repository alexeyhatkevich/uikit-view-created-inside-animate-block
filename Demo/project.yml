name: Demo
options:
  bundleIdPrefix: com.alexeyhatkevich
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  AnimateBlockPitfall:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Demo:
    type: application
    platform: iOS
    sources:
      - path: Demo
    dependencies:
      - package: AnimateBlockPitfall
        product: AnimateBlockPitfall
    info:
      path: Demo/Info.plist
      properties:
        CFBundleDisplayName: AnimateBlockDemo
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexeyhatkevich.uikit-view-created-inside-animate-block.demo
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
schemes:
  Demo:
    build:
      targets:
        Demo: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: AnimateBlockPitfall/AnimateBlockPitfallTests
